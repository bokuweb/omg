name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bonsai-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '6.0.10'
      - run: bash tools/build_bonsai_web.sh

  native-cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p omg-llama --no-default-features
      - run: cargo check -p omg-cli --no-default-features

  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test web/*.test.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo test -p omg-core -p omg-eval -p omg-web -p omg-wgpu
      - run: cargo clippy -p omg-core -p omg-eval -p omg-web -p omg-server -p omg-wgpu -- -D warnings
      - run: cargo build -p omg-web --target wasm32-unknown-unknown
